[package]
name = "Razed"
version = "0.1.0"
edition = "2024"

[profile.release]
codegen-units = 1
lto = false
panic = "abort"

[dependencies]
janus = { path = "../../janus", features = ["expose_gl", "render", "input", "jobs"] }
ethel = { path = "../../ethel", features = ["profile", "rayon", "assets"] }
physics = { path = "../physics" }
polys = { path = "../polys" }
glam = "=0.31.0"
log = "0.4.29"
paste = "1.0.15"
rand = "0.10.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
rustc-hash = "2.1.1"
chrono = "0.4.44"
indoc = "2.0.7"
rayon = "1.12.0"
gui = { path = "../gui", features = ["taffy"] }
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }
nalgebra = "0.35.0"

[features]
default = []
devmode = []
